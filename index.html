<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lamia Jahan Juthy (Evana)</title>
    <style>
        /* --- RESET & BASICS --- */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: white;
            cursor: none; /* Custom cursor implemented */
        }

        /* --- INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            z-index: 1000;
            transition: opacity 2s ease-in-out;
        }

        #gift-box-container {
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlideUp 1s ease forwards 3s;
        }

        .gift-box {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .gift-box:hover {
            transform: rotateY(10deg) rotateX(5deg);
        }

        .face {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.5);
        }

        .front  { transform: translateZ(75px); }
        .back   { transform: rotateY(180deg) translateZ(75px); }
        .right  { transform: rotateY(90deg) translateZ(75px); }
        .left   { transform: rotateY(-90deg) translateZ(75px); }
        .top    { transform: rotateX(90deg) translateZ(75px); height: 75px; top: -37.5px; background: linear-gradient(135deg, #ff6685, #ff7f66); }
        .bottom { transform: rotateX(-90deg) translateZ(75px); height: 75px; bottom: -37.5px; }

        .ribbon-h { position: absolute; top: 50%; left: 0; width: 100%; height: 20px; background: #ffd700; transform: translateY(-50%); }
        .ribbon-v { position: absolute; top: 0; left: 50%; width: 20px; height: 100%; background: #ffd700; transform: translateX(-50%); }
        .bow { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 60px; height: 40px; background: #fff; clip-path: polygon(50% 0%, 100% 30%, 80% 100%, 20% 100%, 0% 30%); }

        #intro-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3.5s;
            background: linear-gradient(to right, #fff, #ffcccc, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .open-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1s ease forwards 4s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .open-btn:hover {
            background: rgba(255, 75, 43, 0.8);
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.5);
            border-color: rgba(255, 75, 43, 0.8);
            transform: translateY(-2px);
        }

        /* --- MAIN EXPERIENCE --- */
        #main-experience {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden initially */
            z-index: 100;
            perspective: 1000px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        #message-box {
            text-align: center;
            opacity: 0;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 80%;
            transform: translateZ(100px) scale(0.8);
            transition: opacity 2s ease, transform 2s ease;
        }

        #message-box.show {
            opacity: 1;
            transform: translateZ(100px) scale(1);
        }

        #main-title {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s linear infinite;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        #main-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            line-height: 1.8;
            color: #eee;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- HUD ELEMENTS --- */
        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 200;
            opacity: 0;
            transition: opacity 1s ease 5s;
        }

        #hud.show { opacity: 1; }

        .hud-box {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value { font-size: 1.2rem; font-weight: 500; font-variant-numeric: tabular-nums; }

        #clock-box { text-align: left; }
        #countdown-box { text-align: center; }
        #cake-box { text-align: right; cursor: pointer; pointer-events: auto; } /* Wish button interactive */

        #cake-icon { font-size: 2rem; margin-bottom: 5px; display: block; }
        
        #wish-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }
        #wish-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255,75,43,0.4); }

        /* --- CUSTOM CURSOR --- */
        #cursor {
            width: 20px;
            height: 20px;
            background: rgba(255, 75, 43, 0.8);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.8), 0 0 30px rgba(255, 75, 43, 0.4);
            transition: transform 0.1s ease, background 0.3s ease;
            mix-blend-mode: screen;
        }

        #cursor.click {
            transform: scale(2);
            background: rgba(255, 255, 255, 0.8);
        }

        /* --- ANIMATIONS KEYFRAMES --- */
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            #main-title { font-size: 2.5rem; }
            #main-subtitle { font-size: 1.1rem; padding: 0 10px; }
            #hud { flex-direction: column; align-items: center; gap: 15px; bottom: 10px; left: 10px; right: 10px; }
            .hud-box { width: 100%; text-align: center; }
            #cake-box { text-align: center; }
            #intro-text { font-size: 1.1rem; padding: 0 20px; }
        }
    </style>
</head>
